name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          SECRET_KEY: "ci-secret-key-for-testing-only-min32chars!!"
          ANTHROPIC_API_KEY: "sk-ant-test-key-not-real-just-for-ci"
          APP_ENV: "development"
        run: pytest tests/ -v
